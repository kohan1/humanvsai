<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>human vs ai</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            background: #080808;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        #mesh { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
        .stage {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 10; pointer-events: none;
        }
        .title {
            font-size: clamp(3.8rem, 9vw, 8.5rem);
            font-weight: 300; letter-spacing: -0.02em; line-height: 1;
            color: #fff; text-align: center;
            font-family: Georgia, 'Times New Roman', serif;
            opacity: 0; transform: translateY(22px);
            animation: up 1.2s cubic-bezier(0.16,1,0.3,1) 0.15s forwards;
        }
        .title .vs { color: #555; font-style: italic; font-weight: 300; margin: 0 0.14em; }
        .rule {
            width: 1px; height: 44px; background: #2a2a2a;
            margin: 2.6rem 0 2.2rem;
            opacity: 0; animation: up 1.2s cubic-bezier(0.16,1,0.3,1) 0.38s forwards;
        }
        .enter {
            display: inline-flex; align-items: center; gap: 0.55em;
            padding: 0.72em 2em; border: 1px solid #2a2a2a;
            background: transparent; color: #ccc; font-family: inherit;
            font-size: 0.68rem; font-weight: 400; letter-spacing: 0.22em;
            text-transform: uppercase; text-decoration: none; cursor: pointer;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
            opacity: 0; animation: up 1.2s cubic-bezier(0.16,1,0.3,1) 0.6s forwards;
            pointer-events: all;
        }
        .enter:hover { border-color: rgba(255,255,255,0.4); color: #fff; background: rgba(255,255,255,0.03); }
        .enter .arr { display: inline-block; transition: transform 0.2s; }
        .enter:hover .arr { transform: translateX(5px); }
        .foot {
            position: fixed; bottom: 1.8rem; left: 50%; transform: translateX(-50%);
            font-size: 0.52rem; letter-spacing: 0.18em; color: rgba(255,255,255,0.1);
            text-transform: uppercase; white-space: nowrap; z-index: 10;
            opacity: 0; animation: up 1.2s cubic-bezier(0.16,1,0.3,1) 0.85s forwards;
        }
        @keyframes up { to { opacity: 1; transform: translateY(0); } }
        @media (prefers-reduced-motion: reduce) {
            .title, .rule, .enter, .foot { animation: none; opacity: 1; transform: none; }
        }
    </style>
    <link rel="stylesheet" href="themes.css" />
    <script src="settings.js"></script>
    <script>
    // Before first paint: a themed page must not flash the default
    // palette while settings.js loads.
    try {
        var _s = JSON.parse(localStorage.getItem("humanvsai.settings") || "{}");
        document.documentElement.setAttribute("data-theme", _s.theme || "mesh");
    } catch (e) { document.documentElement.setAttribute("data-theme", "mesh"); }
    </script>
</head>
<body>
    <canvas id="mesh"></canvas>
    <div class="stage">
        <h1 class="title">human<span class="vs">vs</span>ai</h1>
        <div class="rule"></div>
        <a class="enter" href="select.html">enter <span class="arr">→</span></a>
    </div>

    <script>
    (() => {
        const cvs = document.getElementById('mesh');
        const ctx = cvs.getContext('2d');

        const COLS = 22, ROWS = 14;
        const CURSOR_RADIUS = 180;
        const REPEL_FORCE   = 0.38;
        const DRIFT_AMP     = 14;
        const RETURN_SPEED  = 0.055;

        let W, H, pts;
        let driftT = 0;
        let waveT  = 0;
        let mouseX = -9999, mouseY = -9999;

        window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
        window.addEventListener('touchmove', e => {
            mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY;
        }, { passive: true });

        function resize() {
            W = cvs.width  = window.innerWidth;
            H = cvs.height = window.innerHeight;
            build();
        }

        function build() {
            pts = [];
            const cw = W / COLS, ch = H / ROWS;
            for (let r = 0; r <= ROWS; r++) {
                for (let c = 0; c <= COLS; c++) {
                    pts.push({
                        bx: c * cw, by: r * ch,
                        cx: c * cw, cy: r * ch,
                        ox: (Math.random()-0.5) * DRIFT_AMP * 2.2,
                        oy: (Math.random()-0.5) * DRIFT_AMP * 2.2,
                        f:  0.28 + Math.random() * 0.55,
                        ph: Math.random() * Math.PI * 2,
                    });
                }
            }
        }

        const WAVE_AMP = 22;
        function waveDisplacement(bx, by) {
            const nx = bx / W, ny = by / H;
            const w1 = Math.sin(nx * 4.5 + ny * 2.2 + waveT);
            const w2 = Math.sin(nx * 2.6 - ny * 3.8 + waveT * 0.62 + 1.8);
            const w3 = Math.sin(nx * 1.4 + ny * 1.4 - waveT * 0.4 + 3.1);
            return (w1 * 0.45 + w2 * 0.35 + w3 * 0.2) * WAVE_AMP;
        }

        function update() {
            driftT += 0.00028;
            waveT  += 0.0062;

            for (let i = 0; i < pts.length; i++) {
                const p = pts[i];
                const wob = waveDisplacement(p.bx, p.by);
                const tx = p.bx + p.ox * Math.sin(driftT * p.f + p.ph);
                const ty = p.by + p.oy * Math.cos(driftT * p.f + p.ph + 1.3) + wob;
                const dx = p.cx - mouseX, dy = p.cy - mouseY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                let rx = 0, ry = 0;
                if (dist < CURSOR_RADIUS && dist > 0.1) {
                    const s = (1 - dist / CURSOR_RADIUS) * REPEL_FORCE * CURSOR_RADIUS;
                    rx = (dx / dist) * s;
                    ry = (dy / dist) * s;
                }
                p.cx += (tx + rx - p.cx) * RETURN_SPEED;
                p.cy += (ty + ry - p.cy) * RETURN_SPEED;
                p.wob = wob; // store for node glow/color
            }
        }

        function drawTri(i1, i2, i3) {
            const mx = (pts[i1].cx + pts[i2].cx + pts[i3].cx) / 3;
            const my = (pts[i1].cy + pts[i2].cy + pts[i3].cy) / 3;

            // cursor glow
            const md = Math.sqrt((mx - mouseX)**2 + (my - mouseY)**2);
            const cg = Math.max(0, 1 - md / CURSOR_RADIUS);

            // depth tint from wave — peaks lean cool blue-white, troughs lean dim
            const avgWob = (pts[i1].wob + pts[i2].wob + pts[i3].wob) / 3;
            const depth = (avgWob / WAVE_AMP + 1) / 2; // 0..1

            const r = Math.round(200 + depth * 55);
            const g = Math.round(210 + depth * 45);
            const b = 255;

            const alpha = 0.08 + cg * 0.3 + depth * 0.12;
            const lw    = 0.32 + cg * 0.6 + depth * 0.35;

            ctx.strokeStyle = `rgba(${r},${g},${b},${Math.min(alpha, 0.72)})`;
            ctx.lineWidth   = lw;
            ctx.beginPath();
            ctx.moveTo(pts[i1].cx, pts[i1].cy);
            ctx.lineTo(pts[i2].cx, pts[i2].cy);
            ctx.lineTo(pts[i3].cx, pts[i3].cy);
            ctx.closePath();
            ctx.stroke();
        }

        function drawNodes() {
            for (let i = 0; i < pts.length; i++) {
                const p = pts[i];
                const depth = (p.wob / WAVE_AMP + 1) / 2;
                if (depth < 0.72) continue; // only glow near wave crests
                const md = Math.sqrt((p.cx - mouseX)**2 + (p.cy - mouseY)**2);
                const cg = Math.max(0, 1 - md / CURSOR_RADIUS);
                const size = 1 + depth * 1.4 + cg * 1.2;
                const alpha = (depth - 0.72) * 2.4 + cg * 0.3;
                ctx.beginPath();
                ctx.arc(p.cx, p.cy, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(220,232,255,${Math.min(alpha, 0.8)})`;
                ctx.fill();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            update();

            const stride = COLS + 1;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const a = r * stride + c;
                    drawTri(a, a+1, a+stride);
                    drawTri(a+1, a+stride+1, a+stride);
                }
            }

            drawNodes();

            // cursor halo
            if (mouseX > 0) {
                const g = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, CURSOR_RADIUS);
                g.addColorStop(0,   'rgba(210,225,255,0.05)');
                g.addColorStop(0.5, 'rgba(210,225,255,0.017)');
                g.addColorStop(1,   'rgba(210,225,255,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, CURSOR_RADIUS, 0, Math.PI*2);
                ctx.fill();
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize();
        draw();
    })();
    </script>
</body>
</html>
