<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>select — human vs ai</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; min-height: 100%;
            background: #080808; color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        #mesh { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
        .back {
            position: fixed; top: 1.6rem; left: 1.8rem;
            display: inline-flex; align-items: center; gap: 0.4em;
            font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
            color: #555; text-decoration: none; transition: color 0.15s; z-index: 100;
        }
        .back:hover { color: #bbb; }
        .page {
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 6rem 2rem 4rem; position: relative; z-index: 10;
        }
        .header {
            text-align: center; margin-bottom: 3.5rem;
            opacity: 0; transform: translateY(16px);
            animation: up 0.9s cubic-bezier(0.16,1,0.3,1) 0.05s forwards;
        }
        .header .eyebrow {
            font-size: 0.58rem; letter-spacing: 0.24em; text-transform: uppercase;
            color: #555; margin-bottom: 0.9rem;
        }
        .header h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(1.6rem, 3.5vw, 2.6rem);
            font-weight: 300; letter-spacing: -0.01em; color: #fff;
        }
        .grid {
            display: grid; grid-template-columns: repeat(3, minmax(0, 260px));
            justify-content: center;
            gap: 1px; width: fit-content; max-width: 100%;
            background: #1e1e1e; border: 1px solid #1e1e1e;
            opacity: 0; animation: up 0.9s cubic-bezier(0.16,1,0.3,1) 0.22s forwards;
        }
        @media (max-width: 720px) {
            .grid { grid-template-columns: repeat(auto-fit, minmax(220px, 260px)); }
        }
        .card {
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 2rem 2rem 1.8rem; background: #080808;
            text-decoration: none; color: #aaa; min-height: 180px;
            transition: background 0.18s, color 0.18s; position: relative; overflow: hidden;
        }
        .card::after {
            content: ''; position: absolute; inset: 0;
            border: 1px solid transparent; transition: border-color 0.18s; pointer-events: none;
        }
        .card:hover { background: #111; color: #fff; }
        .card:hover::after { border-color: rgba(255,255,255,0.15); }
        .card-num { font-size: 0.55rem; letter-spacing: 0.2em; text-transform: uppercase; color: #444; }
        .card-name {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.55rem; font-weight: 300; letter-spacing: -0.01em; line-height: 1.1; color: inherit;
        }
        .card-meta { display: flex; align-items: center; justify-content: space-between; }
        .card-tag { font-size: 0.55rem; letter-spacing: 0.16em; text-transform: uppercase; color: #444; }
        .card-arrow { font-size: 0.85rem; color: #444; transition: transform 0.2s, color 0.18s; }
        .card:hover .card-arrow { transform: translateX(4px); color: #aaa; }
        /* Spans all three game cards. Laid out as one horizontal bar rather
           than a tall card, so it reads as a different kind of destination
           instead of a fourth game. */
        .card-wide {
            grid-column: 1 / -1;
            flex-direction: row; align-items: center; justify-content: space-between;
            min-height: 0; padding: 1.4rem 2rem;
        }
        .card-wide .wide-left { display: flex; align-items: baseline; gap: 1.1rem; }
        .card-wide .wide-right { display: flex; align-items: center; gap: 1.4rem; }
        .card-wide .card-name { font-size: 1.2rem; }
        @media (max-width: 720px) {
            .card-wide .card-tag { display: none; }
        }

        .foot {
            margin-top: 4rem; font-size: 0.52rem; letter-spacing: 0.16em;
            color: rgba(255,255,255,0.1); text-transform: uppercase;
            opacity: 0; animation: up 0.9s cubic-bezier(0.16,1,0.3,1) 0.45s forwards;
        }
        @keyframes up { to { opacity: 1; transform: translateY(0); } }
        @media (prefers-reduced-motion: reduce) {
            .header, .grid, .foot { animation: none; opacity: 1; transform: none; }
        }
    </style>
</head>
<body>
    <canvas id="mesh"></canvas>
    <a class="back" href="index.html">← back</a>
    <div class="page">
        <div class="header">
            <p class="eyebrow">select a game</p>
            <h1>human vs ai</h1>
        </div>
        <div class="grid">
            <a class="card" href="snake/game.html">
                <span class="card-num">01</span>
                <span class="card-name">Snake</span>
                <div class="card-meta">
                    <span class="card-tag">arcade</span>
                    <span class="card-arrow">→</span>
                </div>
            </a>
            <a class="card" href="tetris/game.html">
                <span class="card-num">02</span>
                <span class="card-name">Tetris</span>
                <div class="card-meta">
                    <span class="card-tag">strategy</span>
                    <span class="card-arrow">→</span>
                </div>
            </a>
            <a class="card" href="watermelon/game.html">
                <span class="card-num">03</span>
                <span class="card-name">Watermelon Game</span>
                <div class="card-meta">
                    <span class="card-tag">physics</span>
                    <span class="card-arrow">→</span>
                </div>
            </a>
            <a class="card card-wide" href="inside.html">
                <div class="wide-left">
                    <span class="card-num">04</span>
                    <span class="card-name">Inside</span>
                </div>
                <div class="wide-right">
                    <span class="card-tag">how the opponents were trained</span>
                    <span class="card-arrow">→</span>
                </div>
            </a>
        </div>
    </div>

    <!-- The mesh background is shared with inside.html. -->
    <script src="mesh.js"></script>
    <script>initMesh('mesh');</script>
</body>
</html>
