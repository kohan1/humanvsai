<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Play Tetris against a neural network trained with reinforcement learning, running live in your browser." />
        <meta name="theme-color" content="#080808" />
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23080808'/%3E%3Ctext x='16' y='21' font-family='Arial' font-size='13' font-weight='700' fill='%23cfe4ff' text-anchor='middle'%3Evs%3C/text%3E%3C/svg%3E" />
        <title>Tetris — Human vs AI</title>
        <link rel="stylesheet" href="../shared/inspector.css?v=4ffa50b" />
        <link rel="stylesheet" href="../shared/checkpoints.css?v=4ffa50b" />
        <link rel="stylesheet" href="style.css?v=4ffa50b" />
        <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/ort.min.js" defer></script>
        <script src="../shared/model-source.js?v=4ffa50b" defer></script>
        <script src="../shared/settings.js?v=4ffa50b" defer></script>
        <script src="../shared/results.js?v=4ffa50b" defer></script>
        <script src="../shared/inspector.js?v=4ffa50b" defer></script>
        <script src="../shared/checkpoints.js?v=4ffa50b" defer></script>
        <script src="../shared/checkpoint_switcher.js?v=4ffa50b" defer></script>
        <script src="../shared/keyscroll.js?v=4ffa50b" defer></script>
        <script src="../shared/confirm-exit.js?v=4ffa50b" defer></script>
        <script src="game.js?v=4ffa50b" defer></script>
        <link rel="stylesheet" href="../shared/themes.css?v=4ffa50b" />
        <script>
        // Applied before first paint so a themed page never flashes
        // the default palette while the scripts load.
        try {
            var _s = JSON.parse(localStorage.getItem("humanvsai.settings") || "{}");
            document.documentElement.setAttribute("data-theme", _s.theme || "mesh");
        } catch (e) { document.documentElement.setAttribute("data-theme", "mesh"); }
        </script>
        <style>
        /* The theme's background renderer. z-index -1, not 0: a fixed element
           at z-index 0 paints ABOVE static content, which is why index.html
           and select.html have to give every foreground element an explicit
           z-index. A negative value paints above the page background and below
           everything else, so no game markup had to be restacked. */
        #mesh { position: fixed; inset: 0; width: 100%; height: 100%;
                z-index: -1; pointer-events: none; }
        </style>
    </head>
    <body>
        <canvas id="mesh"></canvas>

        <a class="back-nav" href="../select.html">← back</a>

        <div class="screen">
        <div id="arena">

            <!-- ── Human board ── -->
            <div class="board-wrap" id="board-human">
                <div class="board-label">YOU</div>
                <main>
                    <canvas id="canvas-human" width="300" height="540"></canvas>
                    <button id="restart-human" title="Restart">
                        <img src="assets/restart.png" alt="Restart" />
                    </button>
                    <div class="controls" hidden>
                        <div class="row">
                            <kbd>&uparrow;</kbd>
                            <div class="spacer"></div>
                            <kbd>W</kbd>
                        </div>
                        <p>&circlearrowright; Rotate</p>
                        <div class="row">
                            <kbd>&leftarrow;</kbd>
                            <kbd>&rightarrow;</kbd>
                            <div class="spacer"></div>
                            <kbd>A</kbd>
                            <kbd>D</kbd>
                        </div>
                        <p>&leftarrow; Left / Right &rightarrow;</p>
                        <div class="row">
                            <kbd>&downarrow;</kbd>
                            <div class="spacer"></div>
                            <kbd>S</kbd>
                        </div>
                        <p>&downarrow; Soft drop</p>
                        <kbd class="space">Space</kbd>
                        <p>&dArr; Hard drop</p>
                        <p class="controls-start"><span class="hint-keys">Press any key to start</span><span class="hint-touch">Tap to start &middot; tap rotates, swipe moves, swipe down drops</span></p>
                    </div>
                </main>
            </div>

            <!-- ── VS divider ── -->
            <div id="vs">VS</div>

            <!-- ── AI board ── -->
            <div class="board-wrap" id="board-ai">
                <div class="board-label">AI</div>
                <main>
                    <canvas id="canvas-ai" width="300" height="540"></canvas>
                    <button id="restart-ai" title="Restart">
                        <img src="assets/restart.png" alt="Restart" />
                    </button>
                </main>

                <!-- Speed multiplier for the AI. Scales both its think
                     interval and its drop animation. -->
                <div class="speed-controls" id="speed-ai" role="group" aria-label="AI speed">
                    <button type="button" data-speed="0.25">0.25x</button>
                    <button type="button" data-speed="0.5">0.5x</button>
                    <button type="button" data-speed="0.75">0.75x</button>
                    <button type="button" data-speed="1" class="active">1x</button>
                    <button type="button" data-speed="1.5">1.5x</button>
                    <button type="button" data-speed="1.75">1.75x</button>
                    <button type="button" data-speed="2">2x</button>
                </div>
            </div>

        </div>
        </div>
    <!-- The inspector lives below the fold; the scroll cue that
         points at it is created by inspector.js. -->
    <section class="insp-section">
        <div id="insp-mount-ai"></div>
    </section>
        <script src="../shared/backgrounds.js?v=4ffa50b" defer></script>
        <script src="../shared/mesh.js?v=4ffa50b" defer></script>
        <script>
        document.addEventListener('DOMContentLoaded', function () {
            initMesh('mesh', { intensity: 0.55 });
        });
        </script>
    </body>
</html>
