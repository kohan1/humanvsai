<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Play Snake against a neural network trained with reinforcement learning, running live in your browser." />
        <meta name="theme-color" content="#080808" />
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23080808'/%3E%3Ctext x='16' y='21' font-family='Arial' font-size='13' font-weight='700' fill='%23cfe4ff' text-anchor='middle'%3Evs%3C/text%3E%3C/svg%3E" />
        <title>Snake — Human vs AI</title>
        <link rel="stylesheet" href="../shared/inspector.css" />
        <link rel="stylesheet" href="../shared/checkpoints.css" />
        <link rel="stylesheet" href="style.css" />
        <!-- ort.wasm.min.js, not ort.min.js. The game only ever asks for the
             "wasm" execution provider, and ort.min.js is the build that also
             carries WebGL and WebGPU: 368 KB of script instead of 50 KB, and it
             pulls the 27.8 MB jsep .wasm where this one pulls the 14.0 MB plain
             one. Same version, same API, half the download.
             The runtime's two files are preloaded below so they download in
             parallel with the model instead of after it — they are otherwise
             only requested once InferenceSession.create() runs, i.e. after the
             34 MB model has fully arrived. Measured with both delayed: four
             serial round-trips (script, model, .mjs, .wasm) became two. -->
        <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/ort.wasm.min.js" defer></script>
        <link rel="modulepreload" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/ort-wasm-simd-threaded.mjs" />
        <link rel="preload" as="fetch" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/ort-wasm-simd-threaded.wasm" />
        <script>
        // The model itself, over HTTP only. Under file:// fetch() cannot read
        // it (model-source.js uses the embedded base64 there), so a static
        // <link> would just log an error. crossorigin matches fetch()'s default
        // credentials mode, or the preload is not reused and downloads twice.
        if (location.protocol !== "file:") {
            var _p = document.createElement("link");
            _p.rel = "preload"; _p.as = "fetch"; _p.crossOrigin = "anonymous";
            _p.href = "snake_ai.onnx";
            document.head.appendChild(_p);
        }
        </script>
        <script src="../shared/model-source.js" defer></script>
        <script src="../shared/settings.js" defer></script>
        <script src="../shared/results.js" defer></script>
        <script src="../shared/inspector.js" defer></script>
        <script src="../shared/checkpoints.js" defer></script>
        <script src="../shared/checkpoint_switcher.js" defer></script>
        <script src="../shared/keyscroll.js" defer></script>
        <script src="../shared/confirm-exit.js" defer></script>
        <script src="game.js" defer></script>
        <link rel="stylesheet" href="../shared/themes.css" />
        <script>
        // Applied before first paint so a themed page never flashes
        // the default palette while the scripts load.
        try {
            var _s = JSON.parse(localStorage.getItem("humanvsai.settings") || "{}");
            document.documentElement.setAttribute("data-theme", _s.theme || "mesh");
        } catch (e) { document.documentElement.setAttribute("data-theme", "mesh"); }
        </script>
        <style>
        /* The theme's background renderer. z-index -1, not 0: a fixed element
           at z-index 0 paints ABOVE static content, which is why index.html
           and select.html have to give every foreground element an explicit
           z-index. A negative value paints above the page background and below
           everything else, so no game markup had to be restacked. */
        #mesh { position: fixed; inset: 0; width: 100%; height: 100%;
                z-index: -1; pointer-events: none; }
        </style>
    </head>
    <body>
        <canvas id="mesh"></canvas>

        <a class="back-nav" href="../select.html">← back</a>
        <h1 class="sr-only">Snake — Human vs AI</h1>

        <div class="screen">
        <main>
        <div id="arena">

            <!-- ── Human board ── -->
            <div class="board-wrap" id="board-human">
                <div class="board-label">YOU</div>
                <section class="board-main" aria-label="Your board">
                    <canvas id="canvas-human" width="480" height="480" role="img" aria-label="Your Snake board. Steer with the arrow keys or WASD."></canvas>
                    <button id="restart-human" title="Restart your game" aria-label="Restart your game">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 4v6h-6"></path>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                    </button>
                    <!-- One line, on a card below the spawn row. There used to be two
                         lines that said the same thing ("…to move" / "…to start")
                         on a scrim over the whole board, across the snake. -->
                    <div class="controls">
                        <p><span class="hint-keys">Press an arrow key or WASD to start</span><span class="hint-touch">Swipe on the board to start</span></p>
                    </div>
                    <p class="sr-only" id="sr-human" aria-live="polite"></p>
                </section>
            </div>

            <!-- ── VS divider ── -->
            <div id="vs">VS</div>

            <!-- ── AI board ── -->
            <div class="board-wrap" id="board-ai">
                <div class="board-label">AI</div>
                <section class="board-main" aria-label="AI board">
                    <canvas id="canvas-ai" width="480" height="480" role="img" aria-label="The AI's Snake board."></canvas>
                    <button id="restart-ai" title="Restart the AI" aria-label="Restart the AI">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 4v6h-6"></path>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                    </button>
                    <div class="ai-status" id="ai-status" hidden><b></b><span></span></div>
                    <p class="sr-only" id="sr-ai" aria-live="polite"></p>
                </section>
                <!-- AI speed, the same row as Tetris and Watermelon. Scales how
                     many simulation steps the AI board takes per tick; any
                     speed but 1x leaves the match unscored. -->
                <div class="speed-block">
                    <div class="speed-title" id="speed-title-ai">AI speed</div>
                    <div class="speed-controls" id="speed-ai" role="group" aria-labelledby="speed-title-ai">
                        <button type="button" data-speed="0.25" aria-pressed="false">0.25x</button>
                        <button type="button" data-speed="0.5" aria-pressed="false">0.5x</button>
                        <button type="button" data-speed="0.75" aria-pressed="false">0.75x</button>
                        <button type="button" data-speed="1" aria-pressed="true" class="active">1x</button>
                        <button type="button" data-speed="1.5" aria-pressed="false">1.5x</button>
                        <button type="button" data-speed="2" aria-pressed="false">2x</button>
                    </div>
                </div>
            </div>

        </div>
        </main>
        </div>
    <!-- The inspector lives below the fold; the scroll cue that
         points at it is created by inspector.js. -->
    <section class="insp-section">
        <div id="insp-mount-ai"></div>
    </section>
        <script src="../shared/backgrounds.js" defer></script>
        <script src="../shared/mesh.js" defer></script>
        <script>
        document.addEventListener('DOMContentLoaded', function () {
            initMesh('mesh', { intensity: 0.55, maxFps: 30 });
        });
        </script>
    </body>
</html>
