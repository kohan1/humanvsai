<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Snake — Human vs AI</title>
        <link rel="stylesheet" href="../shared/inspector.css" />
        <link rel="stylesheet" href="../shared/checkpoints.css" />
        <link rel="stylesheet" href="style.css" />
        <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
        <script src="model_data.js"></script>
        <script src="../shared/settings.js"></script>
        <script src="../shared/results.js"></script>
        <script src="../shared/inspector.js"></script>
        <script src="../shared/checkpoints.js"></script>
        <script src="../shared/checkpoint_switcher.js"></script>
        <script src="game.js" defer></script>
        <link rel="stylesheet" href="../shared/themes.css" />
        <script>
        // Applied before first paint so a themed page never flashes
        // the default palette while the scripts load.
        try {
            var _s = JSON.parse(localStorage.getItem("humanvsai.settings") || "{}");
            document.documentElement.setAttribute("data-theme", _s.theme || "mesh");
        } catch (e) { document.documentElement.setAttribute("data-theme", "mesh"); }
        </script>
        <style>
        /* The theme's background renderer. z-index -1, not 0: a fixed element
           at z-index 0 paints ABOVE static content, which is why index.html
           and select.html have to give every foreground element an explicit
           z-index. A negative value paints above the page background and below
           everything else, so no game markup had to be restacked. */
        #mesh { position: fixed; inset: 0; width: 100%; height: 100%;
                z-index: -1; pointer-events: none; }
        </style>
    </head>
    <body>
        <canvas id="mesh"></canvas>

        <a class="back-nav" href="../select.html">← back</a>

        <div class="screen">
        <div id="arena">

            <!-- ── Human board ── -->
            <div class="board-wrap" id="board-human">
                <div class="board-label">YOU</div>
                <main>
                    <canvas id="canvas-human" width="480" height="480"></canvas>
                    <button id="restart-human" title="Restart">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 4v6h-6"></path>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                    </button>
                    <div class="controls" hidden>
                        <p>&uparrow; &leftarrow; &downarrow; &rightarrow; or WASD to move</p>
                        <p style="margin-top:1em;font-size:0.8em;color:#aaa">Press any key to start</p>
                    </div>
                </main>
            </div>

            <!-- ── VS divider ── -->
            <div id="vs">VS</div>

            <!-- ── AI board ── -->
            <div class="board-wrap" id="board-ai">
                <div class="board-label">AI</div>
                <main>
                    <canvas id="canvas-ai" width="480" height="480"></canvas>
                    <button id="restart-ai" title="Restart">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 4v6h-6"></path>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                    </button>
                    <div class="ai-status" id="ai-status"></div>
                </main>
            </div>

        </div>
        </div>
    <!-- The inspector lives below the fold; the scroll cue that
         points at it is created by inspector.js. -->
    <section class="insp-section">
        <div id="insp-mount-ai"></div>
    </section>
        <script src="../shared/backgrounds.js"></script>
        <script src="../shared/mesh.js"></script>
        <script>
        document.addEventListener('DOMContentLoaded', function () {
            initMesh('mesh', { intensity: 0.55 });
        });
        </script>
    </body>
</html>
